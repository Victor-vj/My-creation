<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hidden Object Practice – Autumn Park</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#3b2a1c;--mute:#7a6a5a;--acc:#d9731a;--line:#e6d8c6;--ok:#2e7d32;--bad:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#201812;--card:#2d231a;--ink:#f3e6d5;--mute:#b8a690;--acc:#f0903a;--line:#46372a;--ok:#7bd37f;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#201812;--card:#2d231a;--ink:#f3e6d5;--mute:#b8a690;--acc:#f0903a;--line:#46372a;--ok:#7bd37f;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin:2px 2px 8px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-weight:600;font-size:.92rem}
.chip.done{text-decoration:line-through;opacity:.45;border-color:var(--ok);color:var(--ok)}
#wrap{position:relative;border-radius:12px;overflow:hidden;line-height:0;touch-action:manipulation;cursor:pointer}
#wrap img{width:100%;height:auto;display:block;-webkit-user-select:none;user-select:none}
.ring{position:absolute;width:10%;aspect-ratio:1;border:3px solid #3ddc84;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:rgba(61,220,132,.18)}
.ring.hint{border-color:#ffd400;background:rgba(255,212,0,.2);animation:p 1s infinite}
@keyframes p{50%{transform:translate(-50%,-50%) scale(1.25)}}
.miss{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;background:rgba(220,40,40,.5);transform:translate(-50%,-50%);pointer-events:none}
.row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.end{position:absolute;inset:0;background:rgba(0,0,0,.72);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.5;padding:20px}
.end b{font-size:1.5rem}
</style></head><body><main>

<script>
var ITEMS=[["Plane", 0.4697, 0.0812, 0.0711], ["Squirrel", 0.863, 0.0893, 0.0878], ["Umbrella", 0.1393, 0.2248, 0.0485], ["Duck", 0.4756, 0.2193, 0.0519], ["Roller Skates", 0.202, 0.2898, 0.0602], ["Butterfly", 0.453, 0.3196, 0.0586], ["Frisbee", 0.0932, 0.3304, 0.0586], ["Skateboard", 0.0932, 0.4089, 0, 0.0736, 0.0351, -0.2], ["Rugby", 0.8044, 0.4171, 0.0711], ["Bag", 0.8964, 0.3575, 0.0636], ["Jump Rope", 0.0681, 0.4821, 0.0602], ["Leash", 0.4697, 0.436, 0, 0.1129, 0.0251, 0.0], ["Telescope", 0.9006, 0.5037, 0.1046], ["Chess Set", 0.0681, 0.5985, 0.0736], ["Pinwheel", 0.2564, 0.5877, 0.0636], ["Boomerang", 0.5492, 0.5633, 0.0753], ["Thermos", 0.8253, 0.6012, 0.0711], ["Helmet", 0.1744, 0.6987, 0.0669], ["Sunglasses", 0.5116, 0.6933, 0, 0.0736, 0.0435, 0.0], ["Mittens", 0.6538, 0.6798, 0.0669], ["Cooler", 0.8713, 0.7773, 0.1004], ["Racket", 0.5743, 0.8071, 0, 0.1171, 0.0435, 0.55], ["Gnome", 0.2522, 0.8667, 0.0837], ["Blanket", 0.8881, 0.9588, 0.1088]];
var wrap=document.getElementById("wrap"),img=document.getElementById("img");
var order,targets,foundN,misses,t0,tick,gameOver;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(s){return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
function clearMarks(){wrap.querySelectorAll(".ring,.miss").forEach(function(e){e.remove()})}
function start(){
  order=shuffle(ITEMS);targets=order.slice(0,6);order=order.slice(6);foundN=0;misses=0;gameOver=false;
  clearMarks();document.getElementById("end").style.display="none";
  t0=Date.now();clearInterval(tick);tick=setInterval(function(){document.getElementById("time").textContent=fmt(Math.floor((Date.now()-t0)/1000))},500);
  draw();
}
function draw(){
  document.getElementById("found").textContent="Found "+foundN+"/"+ITEMS.length;
  document.getElementById("miss").textContent="Misses "+misses;
  var h="";targets.forEach(function(t){h+='<div class="chip">'+t[0]+'</div>'});
  document.getElementById("chips").innerHTML=h;
}
function addRing(x,y,cls,rad){var r=document.createElement("div");r.className="ring "+(cls||"");r.style.width=((rad||0.055)*200)+"%";r.style.left=x*100+"%";r.style.top=y*100+"%";wrap.appendChild(r);return r}
function qOf(t,fx,fy,b){var dx=(fx-t[1])*b.width,dy=(fy-t[2])*b.height;
  if(t[4]){var c=Math.cos(t[6]),s=Math.sin(t[6]),u=dx*c+dy*s,v=-dx*s+dy*c;return Math.max(Math.abs(u)/(t[4]*b.width),Math.abs(v)/(t[5]*b.width))}
  return Math.hypot(dx,dy)/(b.width*(t[3]||0.055))}
function addRingT(t,cls){var r=addRing(t[1],t[2],cls,t[3]);if(t[4]){var b=img.getBoundingClientRect();r.style.width=(t[4]*200)+"%";r.style.height=(t[5]*200*b.width/b.height)+"%";r.style.aspectRatio="auto";r.style.borderRadius="10px";r.style.transform="translate(-50%,-50%) rotate("+t[6]+"rad)";r.style.animation="none"}return r}
wrap.addEventListener("click",function(e){
  if(gameOver)return;
  var b=img.getBoundingClientRect(),fx=(e.clientX-b.left)/b.width,fy=(e.clientY-b.top)/b.height;
  var hit=-1,best=9;
  targets.forEach(function(t,i){var q=qOf(t,fx,fy,b);if(q<=1&&q<best){best=q;hit=i}});
  if(hit>=0){
    var t=targets[hit];addRingT(t,"");foundN++;
    if(order.length){targets[hit]=order.shift()}else{targets.splice(hit,1)}
    wrap.querySelectorAll(".ring.hint").forEach(function(r){r.remove()});
    draw();
    if(foundN===ITEMS.length)finish();
  }else{
    misses++;draw();
    var m=document.createElement("div");m.className="miss";m.style.left=fx*100+"%";m.style.top=fy*100+"%";wrap.appendChild(m);
    setTimeout(function(){m.remove()},350);
  }
});
document.getElementById("hint").onclick=function(){
  if(gameOver||!targets.length)return;
  wrap.querySelectorAll(".ring.hint").forEach(function(r){r.remove()});
  var t=targets[Math.floor(Math.random()*targets.length)];
  var r=addRingT(t,"hint");setTimeout(function(){r.remove()},2500);
};
function finish(){
  gameOver=true;clearInterval(tick);
  var e=document.getElementById("end");
  e.innerHTML="<b>🍂 All "+ITEMS.length+" found!</b>Time: "+fmt(Math.floor((Date.now()-t0)/1000))+"<br>Misses: "+misses+"<br><br>Tap “New game” to play again.";
  e.style.display="flex";
}
document.getElementById("again").onclick=start;
start();
</script></body></html>
